name: Lint on PR

on:
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install linters
        run: npm install htmlhint stylelint stylelint-config-standard
      - name: Run HTMLHint
        run: npx htmlhint "src/**/*.html"
      - name: Run Stylelint
        run: npx stylelint "styles/**/*.css"
